<script id="data" type="application/json">{"d":[["İlk yardım ile ilgili aşağıda verilenlerden hangisi doğrudur?",["Acil serviste yapılan müdahaledir.","Yoğun bakımda yapılan müdahaledir.","Ambulansta hekim tarafından yapılan ilk müdahaledir.","Olay yerindeki mevcut imkânlarla uygulanan hızlı ve etkili müdahaledir."],3,0],["“Ani olarak ortaya çıkan hastalık veya yaralanma durumunda; kişinin hayatını korumak, sağlık durumunun kötüleşmesini önlemek ve iyileşmesine destek olmak amacıyla olay yerindeki mevcut imkânlarla uygulanan hızlı ve etkili müdahale” olarak tanımlanan kavram aşağıdakilerden hangisidir?",["Acil tedavi","İlk yardım","Acil müdahale","İleri yaşam desteği"],1,0],["Aşağıdakilerden hangisi ilk yardımcıda bulunması gereken özelliklerden değildir?",["Sakin, kendine güvenli ve pratik olmalı","İnsan vücudu ile ilgili temel bilgilere sahip olmalı","Önce etrafındakilerin can güvenliğini korumalı","İyi bir iletişim becerisine sahip olmalı"],2,0],["“Sağlık, yaşam, mülk veya çevre için acil risk oluşturan durumları ifade eden ve çoğu zaman kötüleşmeyi önlemek için acil müdahale gerektiren olaylar” olarak tanımı verilen kavram aşağıdakilerden hangisidir?",["Acil durum","Tedavi","Kurtarma","İlk yardım"],0,0],["I. Kişinin hayatını korumak II. İyileşmesine destek olmak III. Sağlık durumunun kötüleşmesini önlemek IV. Kişiye teşhis koymak || Yukarıda verilenlerden hangileri ilk yardımın amaçlarındandır?",["III- IV","I- II- III","I- III- IV","II- III-IV"],1,0],["Aşağıdakilerden hangisi ilk yardımın amaçlarından değildir?",["Hayatını korumak","Hastaya teşhis koymak","İyileşmesine destek olmak","Sağlık durumunun kötüleşmesini önlemek temel"],1,0],["Aşağıdakilerden hangisi bilinci yerinde olmayan bir hasta/yaralıya müdahale öncesi doğru yaklaşımdır?",["Rıza alınmış kabul edilerek ilk yardım uygulanmalı","İzin beklenmeli","Doktor gelene kadar beklenmeli","Hiçbir şey yapılmamalı"],0,0],["Olay yerinin güvenli hale getirilmesinde ilk yardımcının aşağıdakilerden hangisini yapması doğru değildir?",["Olayın ne olduğunu anlamaya çalışır.","Olay yerinde tehlikeli bir durum varsa uzaklaşır.","Gerekli güvenlik önlemlerini alır.","Olay yeri güvensiz de olsa ilk yardıma başlar."],3,0],["Aşağıdakilerden hangisi olay yerinin güvenli hale getirilmesinde yapılacak doğru bir uygulamadır?",["İlk yardımcının can güvenliği her zaman önceliklidir.","Olay yeri trafik, yangın, elektrik kabloları yönünden değerlendirilmez.","İlk olarak hasta/yaralı ve olay yerindeki insanları korumak için önlemler alınır.","İlk yardıma başladıktan sonra güvenlik önlemleri alınır."],0,0],["İlk yardımcı trafik kazasına müdahale ediyorsa olay yeri güvenliği açısından aşağıdakilerden hangisini yapması doğru değildir?",["Tüm müdahaleleri trafik kurallarına uyarak yapar.","Trafikteki sürücü ve yayaları uyarır.","Şehir içi 150 metre mesafeye uyarı işareti yerleştirir.","Araçların motorlarını kapatır ve el frenlerini çeker."],2,0],["Aşağıdakilerden hangisi hasta/yaralının yerinin değiştirilmesini gerektiren durumlardan biri değildir?",["Yaralının olay yerinde bırakılması tehlikeliyse","Olay yeri güvenliyse","Sağlık ekibi yakın zamanda gelemeyecekse","Olay yerinde tehlike varsa"],1,0],["Hasta/yaralı değerlendirilirken ilk aşağıdakilerden hangisi kontrol edilmelidir?",["Solunum yolu açıklığı","Solunum durumu","Bilinç durumu","Dolaşım durumu önce"],2,0],["Aşağıdakilerden hangisi hasta/yaralı birincil kontrolünün gerçekleştirilmesi aşamalarından değildir?",["Birincil kontrol ilk izlenim ile başlar.","Kişinin hasta mı yaralı mı olduğuna bakılır.","Kişinin yanıt verme durumu değerlendirilir.","Kişinin tansiyon değerlendirilmesi yapılır."],3,0],["Aşağıdakilerden hangisi hasta/yaralının durumunun değerlendirilmesinde uygulanacak adımlardan değildir?",["Birincil kontrolün gerçekleştirilmesi","Tüm vücudun baştan sona yeniden değerlendirilmesi","Hasta/yaralının hikâyesinin alınması","Hiçbir şey yapmadan olay yerinde beklenilmesi"],3,0],["Aşağıdakilerden hangisi yanıt veren hasta/yaralıda acil durum kabul edilerek hemen 112’nin aranması gereken bir durum değildir?",["Durdurulamayan kanama","Ani körlük, görme değişiklikleri","Hafif baş dönmesi","Suda boğulma"],2,0],["Aşağıdakilerden hangisi yanıt veren hasta/yaralıda ilk yardımcının izlemesi gereken adımlardan değildir?",["İlk yardımcı öncelikle kendini tanıtır.","İlk yardım eğitimi aldığını söyler.","Ne yapacağını açıklar.","Göz teması kurmaktan kaçınır."],3,0],["Aşağıdakilerden hangisi yanıt vermeyen hasta/yaralıda ilk yardımcının yapması gereken uygulamalardan değildir?",["112 acil yardım numarasını arar.","Hasta/yaralıya yarı oturur pozisyon verir.","Solunumunu değerlendirirken göğüs hareketlerine bakar.","Hasta/yaralıda solunum varsa derlenme pozisyonu verir."],1,0],["Tüm vücudun baştan sona yeniden değerlendirilmesinde aşağıdakilerden hangisi yaralanmanın ciddi olduğunu düşündüren durumlardan değildir?",["Kişinin boyunun üç katından daha yüksekten düşmesi","Bilinç değişikliğine neden olan baş yaralanması","Küçük yanık yarası","Aracın yayalara çarpması"],2,0],["Hasta/yaralının hikâyesinin alınmasında aşağıdakilerden hangisinin yapılması doğru değildir?",["Yaralanmanın nedeni belirlenir.","Hasta/yaralıdan neler olduğunu ayrıntılı olarak açıklaması istenir.","Hasta/yaralıya “Sorun nedir?”, “Size ne oldu?” gibi sorular sorulur.","Hasta/yaralıya teşhis koyulur."],3,0],["Olay yerindeki ilk yardımcı hasta/yaralının en yakın sağlık kuruluşuna sevkini sağlamak için aşağıdaki telefon numaralarından hangisini aramalıdır?",["112","114","118","184"],0,0],["112 Acil Çağrı Merkezini arayan kişinin aşağıdakilerden hangisini yapması yanlıştır?",["Sakin olması","Kendisini tanıtması","Sorulan sorulara net cevap vermesi","Adres vermeden telefonu kapatması"],3,0],["112 Acil Çağrı Merkezinin aranması sırasında aşağıdakilerden hangisinin yapılması yanlıştır?",["Yaralı sayısının bildirilmesi","Arayan kişinin kendini tanıtması","Yaralıların durumuyla ilgili bilgi verilmesi","Olay yerindeki herkesin isminin tek tek söylenmesi"],3,0],["Aşağıdakilerden hangisi 112 acil yardım numarası aranırken dikkat edilmesi gereken hususlardan biri değildir?",["İlk yardımcı öncelikle kendini tanıtır.","Hasta/yaralı sayısını tam olarak söyler.","Adres bilgisini açıkça belirtir.","Karşı tarafı dinlemeden telefonu kapatır."],3,0],["İlk yardımcının hasta/yaralıya müdahale ederken aşağıdakilerden hangisini yapması doğru olmaz?",["Soğuktan ve aşırı sıcaktan koruması","Hareket ettirmeden müdahale etmesi","Bulantısı varsa tuzlu yiyecek vermesi","Hasta/yaralıya güven vermesi"],2,0],["I. Durum yaşamı tehdit ediyor mu? II. Durum daha da kötüleşebilir mi? III. Hasta/yaralının hareket ettirilmesi daha fazla yaralanmaya neden olur mu? IV. Kişi hastaneye gitmek istiyor mu? || Yukarıda verilen sorulardan hangisinin yanıtı “evet” ise veya cevap şüpheliyse 112 acil yardım numarası aranmalıdır?",["Yalnız I","I- II","II- III- IV","I- II- III"],3,0],["Hasta/yaralıya ilk yardım uygularken aşağıdakilerden hangisinin yapılması doğru değildir?",["İsmi ile hitap edilir.","Açıklama yapılarak ilk yardım uygulanır.","Bilinç kaybı varsa yiyecek içecek verilir.","Soğuktan ve aşırı sıcaktan korunur."],2,0],["Derlenme (Kurtarma, İyileşme) pozisyonu kime verilir?",["Bilinci açık, solunumu normal olan kişilere","Bilinci olmayan, solunumu olan kişilere","Kalp durması yaşayan kişilere","Şiddetli kanama geçiren kişilere"],1,0],["Derlenme pozisyonu verilmeden önce aşağıdaki uygulamalardan hangisinin yapılması doğru değildir?",["Bilinç kontrol edilir.","Solunum kontrol edilir.","Gözlükleri varsa çıkarılır.","Su içirilir."],3,0],["Aşağıdakilerden hangisi hasta/yaralıya derlenme pozisyonu verilme amaçlarından değildir?",["Hava yolunu açık tutmak","Solunumun devamını sağlamak","Beyne giden kan akımını artırmak","Kusmaya bağlı boğulma riskini önlemek"],2,0],["Aşağıdakilerden hangisi hasta/yaralıya derlenme pozisyonu verilme basamaklarından değildir?",["Hasta/yaralının çevrilmek istenilen tarafına diz çökülür.","Yakındaki kolu vücuduna dik açı ile ettirilmelidir."],1,2],["Aşağıdakilerden hangisi taşıma teknikleri uygulanırken uyulması gereken kurallardan değildir?",["Kuvvetli ve uzun kas grupları kullanılır.","Yavaş ve düzgün adımlarla yürünür.","Kalkarken ağırlık kalça kaslarına verilir.","Hasta/yaralıya uzak mesafede durulur."],3,2],["Aşağıdakilerden hangisi hasta/yaralının taşınmasında uyulması gereken temel kurallardan değildir?",["Ani dönme ve bükülmelerden kaçınılır.","Hızlı ve koşar adımlarla yürünür.","Kuvvetli kaslar kullanılır.","Hasta/yaralıya yakın mesafede durulur."],1,2],["Aşağıdakilerden hangisi hasta/yaralının nakli sırasında uyulması gereken temel kurallardan değildir?",["Gerekmedikçe hasta/yaralı hareket ettirilmemelidir.","Hasta/yaralının baş-boyun-gövde ekseni korunmalıdır.","Nakil sırasında hasta/yaralının genel durumu takip edilmelidir.","Sorumlu kişi hasta/yaralının ayak kısmını tutan kişi olmalıdır."],3,2],["Aşağıdakilerden hangisi rentek manevrası uygulaması için doğru değildir?",["Araç içindeki hasta/yaralının omuriliğine zarar vermeden çıkarmada kullanılır.","Yangın veya patlama riski varlığında uygulanır.","Hastanın solunumu yoksa uygulanır.","Hastanın bilinci açıksa ve hayati risk yoksa uygulanır."],3,2],["Araç içerisindeki hasta/yaralının taşınmasında kullanılan manevra aşağıdakilerden hangisidir?",["Rentek","Altın beşik","Denk kayışı","Kütük yuvarlama"],0,2],["Aşağıdakilerden hangisi rentek manevrasının uygulama basamaklarından değildir?",["Olay yeri güvenli hale getirilir.","Aracın kontağı kapatılır, el freni çekilir.","Hasta/yaralının bilinci değerlendirilir.","Solunum değerlendirilmeden çıkarılır."],3,2],["I. Solunumunun kontrol edilmesi II. Emniyet kemeri takılıysa çıkarılması III. Ayaklarının pedala sıkışmış olup olmadığının kontrol edilmesi IV. Omuzlarına hafifçe dokunarak “İyi misin?” diye sorarak bilinç değerlendirmesi yapılması V. 112 aranması || Rentek manevrasıyla hasta/yaralının araç içinden çıkarılmasında uygulamalar hangi sıralama ile yapılmalıdır?",["IV- V- I- III- II","II- IV- V- I- V- III","III- II- IV- I- V","I- IV- V- II- III"],0,2],["Trafik kazasında araç içinde bilinci açık, görünür bir kanaması ve kırığı olmayan bir hastaya ilk yardımda ne yapılmalıdır?",["Kurtarma (derlenme, iyileşme) pozisyonu verilir.","Sağlık ekipleri gelene kadar hastanın yanında kalıp endişeleri giderilir.","Dış kalp masajı ve suni solunum yapılır.","Hasta en yakın hastaneye taşınır."],1,2],["Aşağıdakilerden hangisi “hasta/yaralının dar, basık ve geçiş güçlüğü olan yerden çıkarılmasında” seçilecek yöntemlerden biridir?",["Sürükleme yöntemi","Omuzda taşıma yöntemi","Sırtta taşıma yöntemi","Yan koltuk desteği yöntemi"],0,2],["Bilinci kapalı bir hastada aşağıdaki yöntemlerinden hangisi kullanılmamalıdır?",["İtfaiyeci yöntemi","Sürükleme yöntemi","Altın beşik yöntemi","Rentek manevrası taşıma"],2,2],["Tek ilk yardımcı ile bilinci açık çocuk veya zayıf yetişkinleri taşımak için kullanılan yöntem aşağıdakilerden hangisidir?",["Kucakta taşıma","Kaşık tekniği","Köprü tekniği","Teskereci yöntemi"],0,2],["Aşağıdakilerden hangisi hasta/yaralının sedye üzerine yerleştirilmesi için kullanılan tekniklerden değildir?",["Kaşık tekniği","Köprü tekniği","Karşılıklı durarak kaldırma","Kucakta taşıma"],3,2],["Hasta/yaralının sedyeye aktarılması için aşağıdaki tekniklerden hangisi kullanılamaz?",["Kütük yuvarlama","Karşılıklı durarak kaldırma","Köprü","Önde beşik"],3,2],["Aşağıdakilerden hangisi hasta/yaralıyı tek ilk yardımcı ile taşıma tekniğidir?",["Sırtta taşıma","Sandalye ile taşıma","Teskereci yöntemi","Altın beşik yöntemi"],0,2],["Yürüyemeyen ya da bilinci kapalı hasta/yaralının taşınmasında kullanılan yöntem aşağıdakilerden hangisidir?",["İtfaiyeci yöntemi","Sırtta taşıma","Önde beşik yöntemi","Altın beşik yöntemi"],0,2],["“Hasta/yaralının iki ilk yardımcı ile ellerin üzerinde taşınması” olarak tanımlanan teknik aşağıdakilerden hangisidir?",["Altın beşik","İtfaiyeci","Köprü","Kaşık"],0,2],["Aşağıdaki hasta/yaralı taşıma hangisi en az iki kişiyle uygulanır?",["İtfaiyeci yöntemi","Sırtta taşıma","Kol ve bacaklardan tutarak taşıma","Kucakta taşıma tekniklerinden"],2,2],["Aşağıda verilen taşıma tekniklerinden hangisi birden fazla ilk yardımcı ile uygulanır?",["İtfaiyeci","Kaşık","Önde beşik","Denk kayışı"],1,2],["Baş-boyun ya da omurga yaralanmasından şüphelenilen hasta/yaralının sedyeye aktarılması için uygulanan yöntem aşağıdakilerden hangisidir?",["Kütük yuvarlama tekniği","Altın beşik yöntemi","Denk kayış yöntem","Önde beşik yöntemi"],0,2],["Aşağıdakilerden hangisi taşıma sırasında hasta/yaralının sedyeden düşmemesi için uyulması gereken kurallardan değildir?",["Hasta/yaralı sedyeye sabitlenmeli","Baş gidiş yönünde olmalı","Güçlü olan ilk yardımcı hasta/yaralının ayak kısmında konumlanmalı","Önce hasta/yaralı battaniye, çarşaf gibi bir malzeme ile sarılmalı"],2,2],["Aşağıdakilerden hangisi sedyenin dört ilk yardımcı ile taşınması sırasında uyulacak kurallardan değildir?",["Hasta/yaralı sedyeye sabitlenmeli","Sedyenin sol tarafından tutanlar sağ, sağ tarafından tutanlar ise sol adımlarıyla yürümeye başlamalı","Dar bölgeden yürürken ilk yardımcılar sırtlarını sedyenin iç kısmına vererek yerleşmeli","Merdiven inerken baş yukarıda olmalı"],1,2],["Otomatik Eksternal Defibrilatör (OED)/Şok cihazı ile ilgili aşağı verilen ifadelerden hangisi yanlıştır?",["Ani kalp durmasında göğse yapıştırılan pedler vasıtasıyla kalbe şok verilmesini sağlayan cihazdır.","Kullanımı zor karmaşık bir cihazdır.","Hafif ve taşınabilir bir cihazdır.","Eğitim almış herkes kullanabilir."],1,3],["Aşağıdakilerden hangisi OED/Şok cihazı uygulaması için doğrudur?",["OED; kalp ritim analizi yaparken hasta/yaralıya dokunulmalıdır.","OED hasta/yaralının solunumunu değerlendirmez.","OED kalp pili olan kişilerde kullanılmaz.","OED uygulaması sonrası yaşam belirtisi gösteren hastalarda cihaz kapatılmalıdır."],1,3],["OED/Şok cihazı ile ilgili aşağı verilen ifadelerden hangisi yanlıştır?",["Hastanın kalp ritmini değerlendirir.","Şok verirken hasta/yaralıya dokunulmamalıdır.","Hasta kendine gelirse cihaz kapatılır.","İlk beş dakikada uygulanırsa sağ kalım oranını artırır."],2,3],["OED/Şok cihazı ile ilgili aşağı verilen ifadelerden hangisi yanlıştır?",["Pedlerin yapışacağı bölgenin kuru olması gerekir.","Gebelerde kullanımı güvenlidir.","Kalp pili olduğu bilinen hastalarda ped kalp pilinden 2,5 cm uzağına yapıştırılmalıdır.","Göğüs bölgesinde yapıştırılmış ilaç bantları varsa kalmalıdır."],3,3],["Aşağıdakilerden hangisi OED/Şok kullanımı için uygundur?",["Pedlerin yapışacağı bölge kuru olduğunda","Yağmur altında","Islak ve metal zeminde","Yanıcı gazların bulunduğu ortamda cihazının"],0,3],["Hasta/yaralıya OED/Şok cihazı bağlandıktan sonra cihaz “Şok gerekli değil” komutu verirse aşağıdaki uygulamalardan hangisinin yapılması doğru değildir?",["Cihazın sesli/görsel yönlendirmeleri takip edilir.","Temel yaşam desteğine başlanır.","Yaşam belirtisi görülürse derlenme pozisyonu verilir.","Derlenme pozisyonu verilince cihaz kapatılıp pedler çıkarılır."],3,3],["OED/Şok cihazı pedlerinin yerleşim yeri hangisinde yanlış verilmiştir?",["Yetişkinlerde köprücük kemiğinin hemen altına ve sağ meme başının üstüne, diğeri göğsün sol tarafına, meme başının soluna ve alt kaburga sınırının üzerine","Çocuklarda çocuk pedleri köprücük kemiğinin hemen altına ve sağ meme başının üstüne, diğeri göğsün sol tarafına, meme başının soluna ve alt kaburga sınırının üzerine","Çocuk 8 yaşın altında ve pedler çok büyükse biri kürek kemikleri arasına ve diğer ped ise göğsün ön kısmına","Bebeklerde köprücük kemiğinin hemen altına ve sol meme başının üstüne, diğeri göğsün sağ tarafına, meme başının soluna ve alt kaburga sınırının üzerine"],3,3],["“Solunumu durmuş ve yaşam belirtisi göstermeyen kişiye hayat kurtarmak amacı ile hava yolu açıklığı sağlandıktan sonra yapay solunum ile akciğerlerine oksijen gitmesini, dış kalp masajı ile de kan pompalanmasını sağlamak üzere yapılan ilaçsız müdahaleye” ne isim verilir?",["Suni Solunum","Dış kalp masajı","Temel Yaşam Desteği","İleri Yaşam Desteği"],2,4],["Temel Yaşam Desteği aşağıdaki uygulamalardan hangisini kapsar?",["Nabız kontrolü","Solunum Sayısı","Nabız sayısı","Kalp masajı ve suni solunumu"],3,4],["Aşağıdakilerden hangisi hayat kurtarma zincirinin birinci halkasıdır?",["Defibrilasyon","112 Acil Çağrı Merkezinin aranması","Kaliteli temel yaşam desteği","İleri yaşam desteği"],1,4],["Aşağıdakilerden hangisi hayat kurtarma zincirinin halkalarından değildir?",["Kaliteli temel yaşam desteği","Emniyet ekiplerine haber verme","Defibrilasyon","İleri yaşam desteği"],1,4],["Aşağıdakilerden hangisinde temel yaşam desteği uygulamasına karar vermeden önce yapılacak işlem basamakları doğru verilmiştir?",["Güvenlik – Yanıtın Değerlendirilmesi – 112 Aranması – Hava Yolu Açıklığı Sağlanması – Solunum Kontrolü","Güvenlik – Solunum Kontrolü – Yanıtın Değerlendirilmesi – 112 Aranması – Hava Yolu Açıklığı Sağlanması","Güvenlik – 112 Aranması – Yanıtın Değerlendirilmesi – Hava Yolu Açıklığı Sağlanması – Solunum Kontrolü","Güvenlik – Yanıtın Değerlendirilmesi – 112 Aranması – Solunum Kontrolü – Hava Yolu Açıklığı Sağlanması"],0,4],["Aşağıda yanıtın değerlendirilmesi ile ilgili verilen bilgilerden hangisi yanlıştır?",["Bebekte omuzlara hafifçe dokunup yüksek sesle seslenerek yanıt kontrol edilir.","Çocukta omuzlara hafifçe dokunup yüksek sesle “İyi misiniz?” diye sorarak yanıt kontrol edilir.","Erişkinde omuzlara hafifçe dokunup yüksek sesle “İyi misiniz?” diye sorarak yanıt kontrol edilir.","Bebekte gözleri açık, agulama yapabiliyorsa yanıtlı kabul edilir."],0,4],["Hasta/yaralıda baş geri - çene yukarı pozisyonunun verilme amacı nedir?",["Dolaşımı düzenlemek için","Hava yolu açıklığını sağlamak için","Sindirim sistemini düzenlemek için","Rahat kusturmak için"],1,4],["Hasta/yaralıda solunum kontrolü nasıl yapılır?",["Göğüs hareketleri gözlemlenir.","Nabzına bakılır.","‘İyi misiniz?’ diye sorulur.","Yanındakilere sorulur."],0,4],["Solunumun olmadığı erişkin bir hastada yapılacak ilk yardıma hangi uygulama ile başlanmalıdır?",["30 göğüs basısı","2 solunum desteği","5 solunum desteği","Derlenme pozisyonu"],0,4],["Yetişkin/Çocuklarda Temel Yaşam Desteği uygulamasında göğüs basısı yerinin tespiti aşamalarından hangisi yanlıştır?",["Her iki elin işaret parmakları ile iman tahtasının alt ve üst ucu tespit edilir.","İşaret parmakları kaldırılmadan başparmaklar ile iman tahtası iki eşit parçaya bölünür.","Altta kalacak olan elin topuğu iman tahtasının alt yarısına yerleştirilir.","Alt yarıya yerleştirilen elin avuç içi göğüs kafesi ile temas ettirilir."],3,4],["Tek ilk yardımcının olduğu olay yerinde TYD uygulanması ile ilgili aşağıdakilerden hangisi doğru değildir?",["30 göğüs basısı, 2 solunum desteği olacak şekilde uygulama yapılır.","Uygulama 5 kez tekrarlandıktan sonra hasta/yaralı kontrol edilir.","OED cihazı gelince göğüs basısına ara vermeden 5 kez uyguladıktan sonra OED cihazı açılır.","OED cihazının sesli ve/veya görsel talimatlarına uyulur."],2,4],["Göğüs basısı sırasında göğüs kafesi ne kadar çöktürülmelidir?",["Göğüs kafesinin 1/2 si kadar","Göğüs kafesinin 1/3 ü kadar","Göğüs kafesinin 1/4 ü kadar","Göğüs kafesinin 1/5 i kadar"],1,4],["Temel yaşam desteği ile ilgili verilen bilgilerden hangisi yanlıştır?",["Hasta/yaralı nefes almaya başlayıncaya kadar devam edilir.","Sağlık ekibi gelinceye kadar devam edilir.","İki ilk yardımcı varsa biri göğüs basısı uygularken diğeri OED cihazının pedlerini yapıştırır.","Yalnızca solunum desteği şeklinde uygulanır."],3,4],["Hava yolu açıklığının sağlanmasında aşağıdakilerden hangisinin yapılması yanlıştır?",["Hasta/yaralının ağız içi kontrol edilir.","Görünen katı bir cisim varsa çıkarılabilecek durumunda ise çıkarılır.","Cisim her durumda çıkarılır.","Ağız içi kontrolünden sonra baş geri-çene yukarı pozisyonu verilir."],2,4],["Tek ilk yardımcı tarafından erişkin bir hastaya temel yaşam desteği uygulanırken yapılması gereken göğüs basısı ve solunum desteği sayısı ne olmalıdır?",["10 göğüs basısı-5 solunum desteği","30 göğüs basısı-2 solunum desteği","10 göğüs basısı-1 solunum desteği","15 göğüs basısı-2 solunum desteği"],1,4],["Solunum desteği uygulamasında ağızdan ağıza soluk verme yöntemi için aşağıdakilerden hangisi yanlıştır?",["Baş geri-çene yukarı pozisyonu verilir.","Alın üzerine konulan elin baş ve işaret parmağı kullanılarak hasta/yaralının burnu kapatılır.","Normal bir soluk alınır, göğüs kafesi yeterince kalkıncaya kadar bir saniye içerisinde üflenir.","Nefesin boşalmasını beklemeden 2. solunum desteği uygulanır."],3,4],["Hasta/yaralıda solunum desteği sırasında hava gitmiyorsa ilk olarak ne yapmak gerekir?",["Karına bası uygulamak gerekir.","Göğse bası uygulamak gerekir.","Baş geri – çene yukarı pozisyonunu düzeltmek gerekir.","Çok kuvvetli üflemek gerekir."],2,4],["Ağızdan buruna soluk verme yönteminde hangisi yanlıştır?",["Hasta/yaralının çenesi desteklenerek ağzı açık tutulur.","Normal bir soluk alınır, hasta/yaralının burnuna ağız yerleştirilir.","Göğüs kafesi yeterince kalkıncaya kadar bir saniye içerisinde üflenir.","Nefesin boşalması beklenip 2. solunum desteği uygulanır."],0,4],["Aşağıdaki durumlardan hangisinde temel yaşam desteğine devam edilmelidir?",["Hasta/yaralı normal nefes almaya başlarsa","112 gelirse","Hasta/yaralı nefes almıyorsa","Olay yeri güvensiz hale gelirse"],2,4],["Aşağıdaki durumlardan hangisinde ilk yardımcı temel yaşam desteğine son verir?",["30 dakika yapıldıktan sonra","10 dakika yapıldıktan sonra","112 gelince","Polis gelince"],2,4],["Temel yaşam desteği uygulanan hasta/yaralı normal nefes almaya başlarsa aşağıdakilerden hangisi yapılmaz?",["Temel Yaşam Desteğine devam edilmez.","Gerekirse derlenme pozisyonu verilir.","Hasta/yaralı yalnız bırakılmaz.","OED kullanıldıysa cihaz kapatılır."],3,4],["I. Güvenlik önlemleri alınır. II. 10 saniyeyi aşmayan solunum kontrolü yapılır. III. Yanıtın (bilincin) değerlendirilmesi yapılır. IV. 112 aranır veya aratılır. V. Solunum yoksa göğüs basısına başlanır. || Çocuklarda temel yaşam desteği uygulama sıralaması hangi seçenekte doğru verilmiştir?",["I- III- IV- II- V","I- III- IV- V- II","I- II- IV- III- V","I- II- III- IV- V"],0,4],["I. Baş geri-çene yukarı pozisyonu verilir. II. 2 dakikanın sonunda hasta/yaralı tekrar değerlendirilir. III. Göğüs kafesi yeterince kalkıncaya kadar nefes verilir. IV. Göğüs basısı yapılır. || Solunumu olmayan çocukta ve bebekte temel yaşam desteği uygulanırken uyulması gereken işlem basamakları hangi seçenekte doğru verilmiştir?",["IV- I- II- III","IV- I- III- II","I- III- IV- II","I- IV- III- II"],1,4],["Çocuklarda temel yaşam desteği ile ilgili verilen bilgilerden hangisi yanlıştır?",["Hasta/yaralı 2 dakikada bir değerlendirilir.","Göğüs basısı dakikada 100-120 bası olacak şekilde uygulanır.","Tek ilk yardımcı varlığında 30 göğüs basısı, 2 solunum olacak şekilde uygulama yapılır.","İki veya daha fazla ilk yardımcı varlığında 30 göğüs basısı, 2 solunum olacak şekilde uygulama yapılır."],3,4],["Çocuklarda temel yaşam desteği ile ilgili verilen bilgilerden hangisi yanlıştır?",["Elin topuğu iman tahtasının alt yarısına yerleştirilir.","Dakikada 100 - 120 göğüs basısı olacak şekilde bir ritim sağlanır.","Kollar dirseklerden bükülerek basılır.","İman tahtası 5 cm çökecek şekilde basılır."],2,4],["Bebeklerde temel yaşam desteği ile ilgili verilen bilgilerden hangisi yanlıştır?",["İman tahtası 4 cm çökecek şekilde basılır.","Tek ilk yardımcı varsa 30 göğüs basısı 2 solunum desteği uygular.","İki başparmak veya iki parmak tekniği kullanılır.","İki parmakla 45 derece açı ile iman tahtasına basılır."],3,4],["Bebeklerde temel yaşam desteği ile ilgili verilen bilgilerden hangisi yanlıştır?",["Solunum desteği verilemiyorsa yalnızca göğüs basısı yapılır.","Tek ilk yardımcı solunum desteği ve göğüs basısını birlikte yapıyorsa göğüs basısında başparmak tekniği kullanır.","İki veya daha fazla ilk yardımcı varsa göğüs basısı ve solunum desteği 15:2 şeklinde uygulanır.","Tek ilk yardımcı varsa göğüs basısı ve solunum desteği 30:2 şeklinde uygulanır."],1,4],["Çocuklarda temel yaşam desteği uygulaması ile ilgili verilen bilgilerden hangisi yanlıştır?",["Tek ilk yardımcı ile 30 göğüs basısı 2 solunum desteği şeklinde uygulanır.","Birden fazla ilk yardımcı ile 15 göğüs basısı 2 solunum desteği şeklinde uygulanır.","5 dakikada bir solunum kontrolü yapılır.","İlk yardımcı göğüs basısına devam ederken ikinci ilk yardımcı varsa OED cihazını bağlar."],2,4],["Aşağıda solunum desteği uygulaması ile ilgili verilen bilgilerden hangisi yanlıştır?",["Solunum desteği göğüs kafesi yeterince kalkıncaya kadar verilir.","Solunum desteği 10 saniye sürecek şekilde uygulanır.","Erişkin ve çocuklarda ağızdan ağıza solunum verilir.","Bebeklerde ağızdan ağız ve buruna solunum verilir."],1,4],["Temel yaşam desteğinde göğüs basısı uygulaması ile ilgili verilen bilgilerden hangisi doğrudur? (Erişkin / Ergen / Çocuk / Bebek)",["Çift elle / Çift elle / Tek elle / İki parmakla","Çift elle / Tek elle / İki parmakla / İki parmakla","Çift elle / Tek elle / Çift parmakla / Tek parmakla","Çift elle / Tek elle / Tek elle / Tek parmakla"],0,4],["Temel yaşam desteğinde göğüs kafesinin çöktürülmesi ile ilgili verilen bilgilerden hangisi doğrudur? (Erişkin / Ergen / Çocuk / Bebek)",["5-6 cm / 5-6 cm / 5 cm / 4 cm","5-6 cm / 5 cm / 4 cm / 4 cm","5-6 cm / 5 cm / 4 cm / 3 cm","5-6 cm / 5 cm / 4 cm / 3 cm"],0,4],["Çocuklarda temel yaşam desteği uygulaması ile ilgili verilen bilgilerden hangisi yanlıştır?",["Göğüs kafesi 3-4 cm çökecek şekilde göğüs basısı uygulanır.","Çocuklarda tek ilk yardımcı varsa 30 göğüs basısı 2 solunum desteği şeklinde uygulanır.","Dakikada 100-120 göğüs basısı olacak şekilde iki dakika uygulanır.","İki dakika/5 döngü sonunda çocuk kontrol edilir."],0,4],["Bebeklerde temel yaşam desteği uygulaması ile ilgili verilen bilgilerden hangisi yanlıştır?",["Bebeklerde temel yaşam desteğine solunumla başlanır.","Dakikada 100-120 göğüs basısı olacak şekilde iki dakika uygulanır.","Göğüs kafesi 4 cm çökecek şekilde göğüs basısı uygulanır.","5 döngü sonunda bebek kontrol edilir."],0,4],["Bebekte/çocukta temel yaşam desteğinin sonlandırılması ile ilgili verilen bilgilerden hangisi yanlıştır?",["Hastada yaşam belirtisi görülünceye kadar devam edilir.","Solunum gelinceye kadar devam edilir.","10 dakika devam edilip bırakılır.","112 olay yerine gelinceye kadar devam edilir."],2,4],["Bebeklerde göğüs basısı ile ilgili aşağıdakilerden hangisi doğrudur?",["İman tahtasının alt ucuna iki parmak yerleştirilir.","İki meme başı arasından çizilen hayali çizginin ortasına ve iman tahtası üzerine iki parmak yan yana yerleştirir.","Meme başlarından geçen hayali çizginin sol tarafına iki parmak yerleştirilir.","Sırta 5 vuru şeklinde olmalıdır."],1,4],["Çocuklarda temel yaşam desteği uygulaması ile ilgili verilen bilgilerden hangisi yanlıştır?",["Solunum kontrolü 10 saniyeyi aşmamalıdır.","Solunum yoksa temel yaşam desteğine başlanır.","Göğüs basısı ile başlanır.","Solunum gelince yüzüstü yatırılır."],3,4],["Solunum yolu kısmi olarak tıkanmış bir kişide aşağıdaki belirtilerden hangisi görülmez?",["Öksürür.","Nefes alır.","Konuşamaz.","Nefes alırken ıslık sesi duyulabilir."],2,5],["I. Bilinç düzeyindeki azalma II. Yutma ve öksürük reflekslerini etkileyen nörolojik bozukluklar III. Solunum sistemini etkileyen hastalıklar IV. Yaşlılık || Yetişkinlerde hava yolu tıkanıklığı için yukarıdakilerden hangileri risk oluşturur?",["I- II- III- IV","I- II-III","II- III- IV","II-III- IV"],0,5],["Hava yolu tam olarak tıkanmış bir kişide aşağıdaki belirtilerden hangisi görülür?",["Öksürebilir.","Nefes alamaz.","Konuşabilir.","Ciltte renk değişikliği görülmez."],1,5],["Kısmi hava yolu tıkanıklığı olan kişide ilk yardım uygulaması nasıl olmalıdır?",["Öksürmeye teşvik edilir.","Karına bası uygulanır.","Sırt vurusu yapılır.","Karına bası ve sırt vurusu birlikte uygulanır."],0,5],["Kısmi hava yolu tıkanıklığı olan kişide öksürmede yetersizlik ve yorulma görülürse ilk yardım uygulaması nasıl olmalıdır?",["Karına bası uygulanır.","Sırt vurusu yapılır.","Hastaya dokunulmaz.","Öksürmeye teşvik edilir."],1,5],["Tam hava yolu tıkanıklığı olan bilinci açık yetişkinde ilk yardım uygulaması nasıl olmalıdır?",["Heimlich manevrası uygulanır.","Kalp masajı yapılır.","Solunum desteğine başlanır.","Öksürmeye teşvik edilir."],0,5],["Tam hava yolu tıkanıklığında ilk yardım uygulaması ile ilgili aşağıdakilerden hangisi yanlıştır?",["Yetişkin ve çocuklarda sırt vurusu ve karın basısı dönüşümlü uygulanır.","Bebeklerde sırt vurusu ve göğüs basısı dönüşümlü uygulanır.","Kilolu yetişkinlerde sırt vurusu ve göğüs basısı dönüşümlü uygulanır.","Hamilelerde sırt vurusu ve karın basısı dönüşümlü uygulanır."],3,5],["Hava yolu tam tıkanıklığında Heimlich manevrası uygulama yeri neresi olmalıdır?",["Göğüs kemiğinin ortasına","Göğüs kemiğinin alt ucuna","Göğüs kemiğinin alt ucu ile göbek deliği arasına","Göbeğin üç parmak altına"],2,5],["Bilinci açık olan yetişkin ve çocukta tam hava yolu tıkanıklığında ilk yardım uygulamaları ile ilgili aşağıdakilerden hangisi yanlıştır?",["112’nin aranması sağlanır.","İki kürek kemiği arasına yönü ileri doğru 5 sırt vurusu uygulanır.","Sırt vurusundan sonra tıkanıklık devam ediyorsa 5 karın basısı uygulanır.","Yetişkin veya çocuk bilincini kaybederse uygulamaya devam edilir."],3,5],["Bebekte kısmi hava yolu tıkanıklığında aşağıdaki belirtilerden hangisi görülmez?",["Ağlama","Öğürme","Çırpınma","Hiç nefes alamama"],3,5],["Bilinci açık bir bebekte havayolu tam tıkanmışsa ne yapılır?",["Yapay solunum uygulanır.","Sırta 5 vuru göğüs kemiğine 5 bası uygulanır.","Temel yaşam desteği uygulanır.","Karına bası uygulanır."],1,5],["Bebeklerde hava yolu tam tıkanıklığında ilk yardım uygulamaları ile ilgili aşağıdakilerden hangisi yanlıştır?",["Kürek kemikleri arasına aşağı ileri yöne doğru 5 defa sert sırt vurusu yapılır.","Sırt vurusu başarısız olursa, 5 defa olacak şekilde göğüs basısı yapılır.","Göğüs basısı içeri ve yukarı doğru iterek uygulanır.","Bebek bilincini kaybederse uygulamaya devam edilir."],3,5],["Heimlich manevrası uygulanırken hastanın bilinci kapanırsa ne yapılır?",["Heimlich manevrası devam edilir.","Sırta 5 vuru göğüs kemiğine 5 bası uygulanır.","Temel yaşam desteği uygulanır.","Karına bası uygulanır."],2,5],["“Bilincin hafif uyku halinden hiçbir uyarana yanıt vermediği derin uyku haline kadar olan değişimlerini kapsayan durum” ne olarak tanımlanır?",["Bilinç bozukluğu","Bilinç açıklığı","Bayılma","Bayılayazma"],0,6],["Aşağıda verilenlerden hangisi bilinç durumu değerlendirilmesi için kullanılan USAY (AVPU) ölçeği ile ilgili yanlıştır?",["Alert - Uyanıklık","Verbal - Sesli uyarana yanıt","Pain - Ağrılı uyarana yanıt","Unresponsive - Yanıtlı"],3,6],["Aşağıda USAY (AVPU) ölçeği ile ilgili verilenlerden hangisi yanlıştır?",["Bilinç durumu değerlendirilmesi için USAY ölçeği kullanılır.","Alert/Uyanık kişi sizinle normal şekilde konuşur.","Verbal/Sesli uyaranlara cevap veren kişi sorulan sorulara cevap verir.","Pain/Ağrılı uyarana cevap varsa bilinci tamamen kapalıdır."],3,6],["Aşağıdakilerden hangisi USAY kriterlerine göre bilinç kontrolü yapılırken ağrılı uyaran verilebilecek yerlerden değildir?",["Yüzüne tokat atmak","İki kaşın orta noktasına bastırmak","İman tahtası üzerine bastırmak","Omuzlara hafifçe dokunmak"],0,6],["Aşağıdakilerden hangisi “kişinin iç ve dış uyaranlardan haberdar olmadığı, gözlerinin kapalı olduğu ve uykuya benzeyen ancak uyandırmanın mümkün olmadığı durumu” tanımlamaktadır?",["Şok","Bayılma","Koma","Havale"],2,6],["Solunumu olan ve bilinci tamamen kapalı hasta/yaralıya aşağıdaki pozisyonlardan hangisi verilir?",["Derlenme pozisyonu","Şok pozisyonu","Yarı oturur pozisyon","Sırt üstü yatış pozisyonu"],0,6],["Bilinç bozukluğu durumunda aşağıdakilerden hangisi yapılmaz?",["Bayılan kişiye şok pozisyonu verilir.","Bilinci kapalı ve solunumu varsa derlenme pozisyonu verilir.","Kusma varsa derlenme pozisyonu verilir.","Bilinci kapalı olan hastaya yarı oturur pozisyon verilir."],3,6],["Bilinç bozuklukları ile ilgili bilgilerden hangisi yanlıştır?",["Yüksek ateşi olan çocukta oda sıcaklığındaki su ile ateş düşürülmeye çalışılır.","İnmeden şüphelenilen hastaya rahat pozisyon verilir.","Kan şekeri düşen bilinçli hastaya ağızdan kesinlikle bir şey verilmez.","Bayılma öncesi durumda fiziksel karşı basınç manevraları uygulanır."],2,6],["“Beyne giden kan akışının azalması ile gelişen kısmi veya tam bir bilinç kaybı” olarak tanımlanan kavram aşağıdakilerden hangisidir?",["Koma","Bayılma","Sıcak çarpması","Kalp spazmı"],1,6],["I. Korku II. Kapalı ortam III. Aniden ayağa kalkma IV. Kan şekerinin düşmesi V. Şiddetli enfeksiyonlar VI. Kan basıncının düşmesi || Yukarıda verilenlerden nedenlerindendir?",["I- II- III- IV- V- VI","I- II- III- VI","III- IV- V- VI","I- III- IV- V- VI hangileri bayılma"],0,6],["Aşağıdakilerden hangisi bayılma belirtilerinden değildir?",["Baş dönmesi","Terleme","Bulanık görme","Solunum durması"],3,6],["Bayılan bir kişiye ilk yardım uygulaması olarak aşağıdakilerden hangisi yapılmalıdır?",["Yüzüne su serpilir.","Şok pozisyonu verilir.","Şakakları ovulur.","Yanağına tokat atılır."],1,6],["Aşağıdakilerden hangisi bayılan bir kişiye yapılan ilk yardım uygulamalarından değildir?",["Hamileliğin geç dönemlerinde ise sol tarafına yatırılır.","Şok pozisyonu verilir.","Sıkan kıyafetleri gevşetilir.","Kusma varsa sırtüstü pozisyon verilir."],3,6],["Aşağıdakilerden hangisi bayılma durumunda dikkat edilmesi gereken hususlardandır?",["Yiyecek içecek verilir.","Kolonya koklatılır.","Kişi düz zemine yatırılır.","Üstüne su dökülür."],2,6],["Aşağıdakilerden hangisi bayılma öncesi (bayılayazma) uygulanan fiziksel karşı basınç manevralarından değildir?",["Çömelme pozisyonu alınır.","Boyun öne doğru eğilir ve çene göğse değdirilmeye çalışılır.","Eller yumruk yapılarak var gücüyle sıkılır.","Eller başın üzerine konulup beklenir."],3,6],["Aşağıdakilerden hangisi “beyindeki bir damarın aniden tıkanması ya da kanamasına bağlı olarak ortaya çıkan durumu” tanımlar?",["Havale","Sara krizi","İnme","Kan şekeri düşüklüğü"],2,6],["Aşağıdakilerden hangisi inme/felç belirtilerinden değildir?",["Vücut bölgelerinde başlayan ani uyuşma","Görmede bulanıklık","Ağızda çürük elma kokusu","Konuşmada zorlanma"],2,6],["Aşağıdakilerden hangisinin değerlendirilmesinde FAST ölçeği kullanılır?",["Astım","Sara (Epilepsi)","Bayılazma","İnme (Felç)"],3,6],["İnme geçirdiğinden şüphe edilen kişide kullanılan FAST ölçeği ile ilgili verilenlerden hangisi doğru değildir?",["Gülümsemesi ya da dişlerini göstermesi istendiğinde iki taraf eşit hareket ediyorsa","Kollarını öne doğru tutması istendiğinde kollardan biri hareket etmez ya da inerse","Kelimeleri söylerken sorun yaşıyor veya hiç konuşamıyorsa","112 acil yardım numarası aranarak sağlık kuruluşuna nakledilmesi"],0,6],["Aşağıdakilerden hangisi inme geçiren kişide yapılması gereken ilk yardım uygulamalarından değildir?",["112 acil yardım numarası aranır.","Yaşam bulguları takip edilir.","Yiyecek ya da içecek verilir.","Oturamıyorsa derlenme pozisyonuna getirilir."],2,6],["“Kişinin istemi dışında vücut kaslarının bir bölümünün ya da tamamının sarsılarak kasılması sonucu ortaya çıkan hastalık” aşağıdakilerden hangisidir?",["Sara","Koma","Senkop","Konversiyon"],0,6],["Sara krizi ile ilgili verilen bilgilerden hangisi yanlıştır?",["Kişi kendisi isteyerek nöbet geçirebilir.","Uykusuzluk, açlık, yüksek ateşe bağlı ortaya çıkabilir.","Zehirlenme, madde bağımlılığına bağlı ortaya çıkabilir.","Herhangi bir nedenle beyin hasarı olan kişide görülebilir."],0,6],["Aşağıdakilerden hangisi sara krizinde doğru ilk yardım uygulamasıdır?",["Nöbet süresi kaydedilir.","Soğan koklatılır.","Kilitlenmiş çene açılır.","Dişlerin arasına cisim yerleştirilir."],0,6],["Aşağıdakilerden hangisi sara krizi geçiren kişide ilk yardım uygulamalarından değildir?",["Başka bir alana taşımaya çalışılmamalıdır.","Hastanın çırpınması engellenir.","Giysiler gevşetilir.","Yaralanması engellenir."],1,6],["Sara krizi ile ilgili verilen bilgilerden hangisi yanlıştır?",["Hasta kriz geçirirken kendini koruyarak yere kontrollü düşer.","Nöbet öncesi bağırma duyulabilir.","Hastada normalde olmayan kokuları alma gibi ön belirtiler görülebilir.","Tüm vücutta yaygın kasılmalar görülebilir."],0,6],["Aşağıdakilerden hangisi sara krizinde nöbet sonrası yapılması gereken ilk yardım uygulaması değildir?",["Gerekliyse 112 acil yardım numarası aranır.","Yaşam bulguları takip edilir.","Hasta/yaralının yanında kalınır.","Kişi şok pozisyonuna getirilir."],3,6],["Çocukta ateşe bağlı nöbette ilk yardım ile ilgili aşağıdakilerden hangisinin yapılması doğrudur?",["Hemen su içirilmelidir.","Oda sıcaklığındaki su ile ateş düşürülmelidir.","Üzerinde bulunan giysileri çıkarılmamalıdır.","Nöbeti durdurulmaya çalışılmalıdır."],1,6],["Çocukluk çağı ateşe bağlı nöbeti olan hastada aşağıdaki ilk yardım uygulamalarından hangisi yanlıştır?",["Çocuk hemen buzlu suya sokulur.","Yiyecek ya da içecek verilmemelidir.","112 acil yardım aranır.","Çocuğa derlenme pozisyonu verilir."],0,6],["Kan şekerinin düştüğünden şüphelenilen kişiye yapılacak ilk yardım uygulaması nasıl olmalıdır?",["Kesinlikle müdahale edilmez.","Şekerli içecek ile düzeliyorsa şeker verilmeye devam edilmez.","Bilinci kapalıysa hastaya şok pozisyonu verilir.","Bilinci açıksa ve kusmuyorsa ağızdan şekerli içecekler verilir."],3,6],["Aşağıdakilerden hangisi kan şekerinin yükseldiğini gösteren belirtilerden biridir?",["Nefeste çürük elma (aseton) kokusu","Nabızda yavaşlama","Solunumun yavaşlaması","Ciltte morarma aşırı"],0,6],["Aşağıdakilerden hangisi bilinci açık ve kan şekeri aşırı yükselen kişide yapılacak ilk yardım uygulamalarından değildir?",["Reçeteli ilaç alıp almadığı sorulur.","Su içmeye teşvik edilir.","Yaşam bulguları takip edilir.","Bilinci kapanırsa yarı oturur pozisyon verilir."],3,6],["Aşağıdakilerden hangisi kan şekeri düşüklüğünden şüphelenilen kişide dikkat edilecek hususlardan değildir?",["İnsülin yapılmamalı","Yaşam bulguları kontrol edilmeli","112 acil yardım numarası aranmalı","Düşüklüğü veya yüksekliği ayırt edilemiyorsa şeker verilmemeli"],3,6],["Aşağıdakilerden hangisi “dil veya boğazda şişme sonrası hava yolunda daralma ve nefes almayı zorlaştıran durumu” ifade eder?",["Havale","İnme","Anafilaksi","Koma"],2,6],["Aşağıdakilerden hangisi şiddetli alerji/anafilaksi belirtilerden değildir?",["Yüz, dudaklar, göz kapakları ve dilde şişme","Kulakta uğultu ve çınlama","Hırıltılı solunum ya da sürekli öksürük","Vücutta yaygın kızarıklık ve döküntüler"],1,6],["Aşağıdakilerden hangisi şiddetli alerji/anafilaksi durumunda yapılması gereken uygulamalardan değildir?",["Kişinin rahat nefes alıp verebileceği pozisyonu almasına yardım edilir.","Kişinin kendiliğinden iyileşmesi beklenir.","Kişinin ilacı varsa kendisinin almasına yardım edilir.","112 acil yardım ekibi gelinceye kadar kişinin yanında kalınır."],1,6],["Aşağıdakilerden hangisi astım atağı belirtilerinden değildir?",["Nefes almakta zorlanma","Fışkırır tarzda kusma","Nefes verirken ıslık sesi duyulması","Göğüste sıkışma veya ağrı hissi"],1,6],["Aşağıdakilerden hangisi astım atağında kişinin durumunun kötüleştiğini gösteren belirtilerden değildir?",["Normal konuşmanın bozulması (cümle kuramama)","İlaçlarını (inhaler) kullanmasına rağmen belirtilerin artması","Dudakların ve tırnakların gri-mavi ton alması","Bulantı olmadan kusması"],3,6],["Aşağıdakilerden hangisi astım atağında doğru ilk yardım uygulamalarından biridir?",["Hasta mutlaka yere yatırılmalıdır.","Hasta yürütülerek sağlık kuruluşuna ulaştırılmalıdır.","Hastanın kendisine ait ilaçlarını almasına yardım edilmelidir.","Ortamdaki kapı ve pencereler kapatılmalıdır."],2,6],["Aşağıdakilerden hangisi astım atağında doğru ilk yardım uygulamalarından değildir?",["Hastanın en rahat olduğu pozisyonu alması sağlanır.","Hasta bilincini kaybederse şok pozisyonu verilir.","Hastanın kendisine ait ilaçları ve mümkünse oksijen almasına yardım edilir.","İlaçları aldıktan sonra 5 dakika içinde düzelme olmazsa 112 acil yardım numarası aranır."],1,6],["Kronik Obstrüktif Akciğer Hastalığı (KOAH) ile ilgili aşağıda verilen bilgilerden hangisi yanlıştır?",["Sıklıkla gençlerde görülen bir hastalıktır.","Genellikle sigara kullanımına bağlı görülür.","Nefes almayı zorlaştıran hava yolu tıkanıklığıdır.","Oturur pozisyonda daha rahat nefes alırlar."],0,6],["Aşağıdakilerden hangisi KOAH atağı sırasında yapılması gereken ilk yardım uygulamalarından değildir?",["Hastanın kendisine ait ilaçlarını almasına yardım edilir.","Varsa oksijen almasına yardım edilir.","Salgılarını atabilmesi için öksürmeye teşvik edilir.","Hasta sırtüstü düz yatırılır."],3,6],["Çok hızlı nefes alıp verme (hiperventilasyon) ile ilgili verilen bilgilerden hangisi yanlıştır?",["Duygusal sıkıntılar ve stres sonucu ortaya çıkabilir.","Eller, ayaklar ve ağız çevresinde karıncalanma ve uyuşma görülebilir.","Karın kasları kullanılarak solunum egzersizleri yaptırılır.","Kişinin yürütülerek hareket etmesi sağlanır."],3,6],["Kalp atımları ile uyumlu olarak fışkırır tarzda, çok kısa sürede büyük miktarda kan kaybına neden olabilen en ciddi kanama hangi damar yaralanmasında ortaya çıkar?",["Atardamar","Toplardamar","Kılcal damar","Lenf damarı"],0,7],["Aşağıdakilerden hangisi kanamanın ciddiyetini belirleyen durumlardan değildir?",["Kanamanın hızı","Vücutta kanın aktığı bölge","Kanamanın sızıntı şeklinde olması","Kanama miktarı"],2,7],["Kanamayı durdurmak için ilk yardımcının ilk yapması gereken aşağıdakilerden hangisidir?",["Bası noktalarına baskı uygulanır.","Kanamalı bölgenin üzerine turnike uygulanır.","Kanamalı bölge su ile yıkanır.","Kanamalı bölgenin üzeri temiz bir bezle kapatılarak yaraya baskı uygulanır."],3,7],["Aşağıdakilerden hangisi dış kanamalarda ilk yardım uygulamalarından değildir?",["Yara üzerine en az 5 dakika boyunca sabit, kesintisiz tam bası uygulanmalı","Kanama üzerindeki ilk bez ıslanırsa, ilk bezi kaldırmadan üzerine başka bez koyarak basıya devam edilmeli","Doğrudan basıda kullandığımız bezleri sabit tutmak için basınçlı bandaj uygulanmalı","Basınçlı bandaj dolaşımı engelleyecek kadar sıkılmalı"],3,7],["Turnike (boğucu sargı) aşağıdakilerden hangisinde uygulanmaz?",["Doğrudan bası ile durdurulabilen kanamalarda","Çok sayıda hasta/yaralının bulunduğu ortamda tek ilk yardımcı varsa","Uzuv kopmalarında","Basınçlı bandaj ile durdurulamayan kanamalarda"],0,7],["Aşağıdaki durumlardan hangisinde turnike uygulanabilir?",["Kanaması olan her hastada","Çok sayıda yaralının bulunduğu bir ortamda tek ilkyardımcı varsa","Toplardamar kanamalarında","İç kanamalarda"],1,7],["Aşağıdakilerden hangisi dış kanamalarda turnike uygulama basamaklarından değildir?",["Kol ve uyluk gibi tek kemikli bölgelere uygulanır.","Kanamaya en yakın ve deri bütünlüğü bozulmamış olan bölgeye uygulanır.","Kanama durduktan sonra sıkmaya devam edilir.","Birden fazla hasta/yaralı varsa hastanın alnına “Turnike/T” yazılır."],2,7],["Aşağıdakilerden hangisi turnike uygulaması ile ilgili doğru bilgi değildir?",["Turnike uygulaması için ip kullanılır.","Kanamaya en yakın ve deri bütünlüğü bozulmamış olan bölgeye uygulanır.","Turnike bölgesi görülecek şekilde hasta/yaralının üzeri örtülür.","Turnike üzerine uygulamanın yapıldığı saati yazılır."],0,7],["Aşağıdaki durumlardan uygulanmalıdır?",["Karın yaralanması","Ezici yaralanma","Göğüs yaralanması","Uzuv kopması hangisinde turnike"],3,7],["Aşağıdakilerden hangisi hasta/yaralıya şok pozisyonu uygulamasını tarif eder?",["Düz olarak sırt üstü yatırılıp ayaklarının 30-60 derece kaldırılması","Düz olarak sırt üstü ve dizlerinin bükülerek yatırılması","Altta kalan kolu başının altında olacak şekilde yan pozisyonda yatırılması","Yüzükoyun düz yatırılması"],0,7],["Aşağıdaki durumlardan hangisinde şok pozisyonu verilir?",["Bayılma","Baş yaralanması","Göğüs ağrısı","Göğüs yaralanması"],0,7],["Aşağıdakilerden hangisi iç kanama belirtilerinden değildir?",["Ağız, burun, kulaktan kan gelmesi","Solunum sayısının artması","Sıcak, kırmızı, kuru cilt","Bilinç değişikliği"],2,7],["Aşağıdakilerden hangisi iç kanamada ilk yardım uygulama bas
